<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>DrillTest itch.io Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;

            min-height: 100vh;
            padding: 24px;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: #ffffff;
            background: #000000;
        }

        .login-panel {
            width: 100%;
            max-width: 520px;

            padding: 36px 32px;

            border: 2px solid #ffffff;
            border-radius: 2px;

            background: #000000;
            text-align: center;
        }

        .title {
            margin: 0 0 16px;

            font-size: 28px;
            font-weight: 600;
            line-height: 1.2;
        }

        .divider {
            width: 100%;
            height: 2px;
            margin-bottom: 28px;

            background: #ffffff;
        }

        .status-icon {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 72px;
            height: 72px;
            margin: 0 auto 24px;

            border: 2px solid #ffffff;
            border-radius: 50%;

            font-size: 38px;
            font-weight: bold;
        }

        .status-text {
            margin: 0;

            font-size: 21px;
            font-weight: 600;
            line-height: 1.4;
        }

        .details {
            margin: 14px 0 0;

            color: #dddddd;
            font-size: 16px;
            line-height: 1.6;
        }

        .error {
            margin: 18px 0 0;

            color: #ff6b6b;
            font-family:
                Consolas,
                Monaco,
                monospace;
            font-size: 14px;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .loading-spinner {
            width: 56px;
            height: 56px;
            margin: 0 auto 24px;

            border: 4px solid #444444;
            border-top-color: #ffffff;
            border-radius: 50%;

            animation: spin 0.8s linear infinite;
        }

        .success-icon {
            display: none;
        }

        .error-icon {
            display: none;

            color: #ff6b6b;
            border-color: #ff6b6b;
        }

        .return-note {
            display: none;

            margin: 24px 0 0;
            padding-top: 18px;

            border-top: 1px solid #555555;

            color: #bbbbbb;
            font-size: 14px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 560px) {
            body {
                padding: 14px;
            }

            .login-panel {
                padding: 28px 20px;
            }

            .title {
                font-size: 24px;
            }

            .status-text {
                font-size: 19px;
            }
        }
    </style>
</head>

<body>
    <main class="login-panel">
        <h1 class="title">
            DrillTest
        </h1>

        <div class="divider"></div>

        <div
            id="loadingSpinner"
            class="loading-spinner"
        ></div>

        <div
            id="successIcon"
            class="status-icon success-icon"
        >
            ✓
        </div>

        <div
            id="errorIcon"
            class="status-icon error-icon"
        >
            !
        </div>

        <h2
            id="status"
            class="status-text"
        >
            Processing itch.io login...
        </h2>

        <p
            id="details"
            class="details"
        >
            Please wait while we verify your account.
        </p>

        <pre
            id="error"
            class="error"
        ></pre>

        <p
            id="returnNote"
            class="return-note"
        >
            You may now return to the game.
        </p>
    </main>

    <script>
        async function completeLogin() {
            const statusElement =
                document.getElementById("status");

            const detailsElement =
                document.getElementById("details");

            const errorElement =
                document.getElementById("error");

            const loadingSpinner =
                document.getElementById("loadingSpinner");

            const successIcon =
                document.getElementById("successIcon");

            const errorIcon =
                document.getElementById("errorIcon");

            const returnNote =
                document.getElementById("returnNote");

            try {
                const parameters = new URLSearchParams(
                    window.location.hash.substring(1)
                );

                const accessToken =
                    parameters.get("access_token");

                const state =
                    parameters.get("state");

                const oauthError =
                    parameters.get("error");

                const oauthErrorDescription =
                    parameters.get("error_description");

                /*
                 * Remove the access token from the browser URL
                 * and history as soon as it has been read.
                 */
                history.replaceState(
                    null,
                    "",
                    window.location.pathname
                );

                if (oauthError) {
                    throw new Error(
                        oauthErrorDescription
                            ? oauthError + ": " +
                              oauthErrorDescription
                            : "OAuth error: " + oauthError
                    );
                }

                if (!accessToken) {
                    throw new Error(
                        "No itch.io access token was received."
                    );
                }

                if (!state) {
                    throw new Error(
                        "No OAuth state identifier was received."
                    );
                }

                const response = await fetch(
                    "./itch_callback.php",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            access_token: accessToken,
                            state: state
                        })
                    }
                );

                const responseText =
                    await response.text();

                let result;

                try {
                    result = JSON.parse(responseText);
                }
                catch {
                    throw new Error(
                        "The server did not return valid JSON:\n" +
                        responseText
                    );
                }

                if (!response.ok || !result.success) {
                    throw new Error(
                        result.message ||
                        "Failed to retrieve the itch.io profile."
                    );
                }

                loadingSpinner.style.display = "none";
                successIcon.style.display = "flex";

                statusElement.textContent =
                    "Login successful!";

                detailsElement.textContent =
                    "Signed in as " +
                    result.data.username +
                    ".";

                errorElement.textContent = "";
                returnNote.style.display = "block";

                /*
                 * Unity retrieves the result through polling,
                 * so window.opener and postMessage are not needed.
                 */
                setTimeout(function () {
                    window.close();
                }, 2500);
            }
            catch (error) {
                loadingSpinner.style.display = "none";
                errorIcon.style.display = "flex";

                statusElement.textContent =
                    "Login failed.";

                detailsElement.textContent =
                    "The itch.io account could not be verified.";

                errorElement.textContent =
                    error instanceof Error
                        ? error.message
                        : String(error);

                console.error(error);
            }
        }

        completeLogin();
    </script>
</body>
</html>
